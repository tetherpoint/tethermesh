[package]
name = "tethermesh"
version = "0.0.0"
edition = "2021"
# Pinned so "it builds" means the same thing on every machine. Raise it
# deliberately, never incidentally.
rust-version = "1.75"
publish = false

# DECIDED 2026-08-16: Apache-2.0, for code AND specification alike.
#
# docs/LICENSING-OPTIONS.md carries the reasoning. In short: the reason to
# prefer Apache-2.0 over MIT here is its explicit patent grant, because the
# strategy is adoption by other implementers -- possibly commercial ones -- of
# a CRYPTOGRAPHIC suite, which is the area where patent uncertainty is taken
# most seriously.
#
# The specification is under the SAME licence rather than CC-BY-4.0, and that
# follows from the same reasoning: CC-BY-4.0 licenses no patent rights at all,
# so putting the spec under it would deny a patent grant to precisely the
# adopter this project is aiming at -- the one who reads the spec and writes
# their own clean-room implementation. Choosing Apache for its patent grant and
# then exempting the document implementers actually work from would be
# self-defeating. It also removes the mixed-licence demarcation problem
# entirely, and this project's "spec" files are unusually code-like: hex
# vectors, byte offsets, register values.
license = "Apache-2.0"

# NO DEPENDENCIES IN THE SHIPPED LIBRARY, AND THAT IS A REQUIREMENT RATHER
# THAN A CURRENT STATE. DISTRIBUTION.md commits to no code-generation
# dependency in the build, and the protobuf codec is hand-written partly so
# that nothing here derives from a copyleft input. A dependency added later
# must clear both bars.
#
# There is a third bar, discovered by measurement on 2026-08-16: the
# panic-free artifact guarantee. The linked object must keep ZERO undefined
# references, which is what tools/check_rust_rules.sh --binary enforces and
# what ours currently has. A dependency must clear that bar too.
#
# BE PRECISE ABOUT HOW STRONG THIS ARGUMENT IS. An earlier version of this
# comment said linking x25519-dalek brings "58 panic symbols" into the
# artifact. That was wrong — it counted core's unreachable code, which is
# present in an empty no_std crate regardless. docs/CRYPTO-DEPENDENCY.md
# retracted it to +8; the 2026-08-16 audit re-measured with
# tools/measure_panic_symbols.sh and got +0 DISTINCT panic symbol names
# (+6 raw archive entries) over a no-dependency baseline.
#
# So the panic bar is NOT what rules out x25519-dalek, and claiming it does
# overstates the case by roughly seven times. fiat-crypto was chosen because
# it is formally verified AND costs nothing — it dominates on its own merits,
# not because the alternative was disqualified. libcrux IS ruled out
# mechanically, but by the allocator rule rather than this one: it fails to
# compile no_std with "no global memory allocator found but one is required".
#
# DEV-DEPENDENCIES ARE A DIFFERENT QUESTION and are used deliberately. A vetted
# implementation is enormously valuable as a TEST ORACLE, and a test binary is
# not the artifact: nothing here is linked into the library, and
# check_rust_rules.sh inspects the library object alone. So the audited code
# checks ours on every run without shipping in it.

# `cfg(kani)` is set by the Kani verifier, not by cargo, so declare it rather
# than let every normal build warn about an unexpected condition name.
# THE ONE DEPENDENCY, AND IT CLEARS EVERY BAR.
#
# fiat-crypto's curve25519 field arithmetic is generated from Coq proofs by
# mit-plv/fiat-crypto — the same pipeline BoringSSL uses. It is triple-licensed
# permissively, is `no_std`, allocates nothing, and adds ZERO panic paths above
# a no-dependency baseline; measured, not assumed, in docs/CRYPTO-DEPENDENCY.md.
#
# It is used for exactly the layer where a hand-written bug bit this project:
# the field arithmetic. The first draft of x25519.rs biased fe_sub by p instead
# of 2p, producing an implementation that was self-consistent and wrong. That
# class of error is what fiat proves away.
#
# It is arithmetic, not codegen: no build script, no proc-macro, no schema
# compiler. The "no code-generation dependency" rule above is about compiling a
# GPL .proto into a codec, and this is not that.
[dependencies]
# Pinned as a SUBMODULE, not pulled from a registry: third_party/fiat-crypto
# at a commit recorded in DEPS.md. The exact source that gets compiled is in
# the tree, auditable offline, and identical for everyone who clones with
# --recurse-submodules. Only fiat-rust/ is checked out (sparse), so the cost
# is a few megabytes rather than the repository's full Coq development.
#
# This works where the same approach failed for libcrux: fiat-rust inherits no
# workspace keys and has no dependencies, so a path dependency on it resolves
# for downstream consumers too. That was verified, not assumed.
fiat-crypto = { path = "third_party/fiat-crypto/fiat-rust", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
# The reference X25519 for differential testing ONLY. BSD-3-Clause, audited,
# and never linked into the shipped library — see the note above. Hand-written
# crypto that agrees with an audited implementation across thousands of random
# inputs is a far stronger claim than one that merely passes fixed vectors,
# and the fe_sub bug found on 2026-08-16 was exactly the kind a fixed vector
# catches only by luck.
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# A SECOND, independent oracle: formally verified, derived from HACL*. Two
# unrelated implementations agreeing with ours is a stronger claim than one.
# It needs a global allocator, which is why it cannot be a real dependency —
# but a test binary has std, so as an oracle that costs nothing.
libcrux-curve25519 = "0.0.8"
rand = "0.8"

[lib]
name = "tethermesh"
path = "meshtastic/core/lib.rs"
# rlib ONLY, for now.
#
# DISTRIBUTION.md promises a prebuilt static library and a C header, which
# means `staticlib` — but a no_std staticlib is a linkable artifact and must
# therefore carry a #[panic_handler], and defining one emits the very
# `rust_begin_unwind` symbol that tools/check_rust_rules.sh --binary treats as
# evidence that some path can panic.
#
# That tension is real and belongs to L8, where the C ABI surface is designed.
# It is written down here rather than resolved early, because the resolution
# affects what the panic-free claim actually means at the artifact boundary.
crate-type = ["rlib"]

# Integration tests live where the repository layout says they live.
# check_rust_rules.sh exempts */tests/* from the no-panic rules on purpose:
# an assertion is a panic, and that is what an assertion is for.
[[test]]
name = "host_unit"
path = "tests/host_unit/main.rs"

[profile.release]
# An aborting panic is what turns a would-be memory error into a halt rather
# than something exploitable. The goal is that no panic path exists at all;
# this is the backstop for having been wrong about that.
panic = "abort"
lto = true
codegen-units = 1
# DISTRIBUTION.md commits to a CI size budget. Optimising for size is the
# default posture for a library that lands on a microcontroller.
opt-level = "z"
