# SPDX-FileCopyrightText: 2026 Matthew Klapman
# SPDX-License-Identifier: Apache-2.0
#
# T8. The header was hand-written because cbindgen was not installed here, and
# a hand-written header against a changing crate drifts silently -- a field
# added on the Rust side shifts every offset after it, and C then reads garbage
# that looks like a protocol bug. tm_check_layout() narrowed that hazard and
# could not remove it: equal sizes do not prove equal field order.
#
# TWO THINGS HERE ARE LOAD-BEARING AND MUST NOT BE "TIDIED".
#
# The renames below keep the published C names. cbindgen would otherwise emit
# the Rust names -- TmKey, not tm_key_t -- and every consumer, every line of
# documentation and every example would break at once. The C spelling is the
# contract; the Rust spelling is an implementation detail.
#
# TmCtx and TmOutbox are EXCLUDED and forward-declared in the preamble instead.
# The in-source `cbindgen:opaque` annotation was tried first and cbindgen 0.29.4
# did not honour it for these `#[repr(C)]` structs -- it emitted their fields
# anyway, including `PacketHistory<HISTORY>`, which is not valid C at all. That
# would publish internals the ABI deliberately hides behind tm_ctx_size() and
# tm_ctx_align(), and would not compile. Exclusion is verified by the generated
# output rather than trusted, which is why it is the mechanism used.
#
# usize_is_size_t keeps `size_t` in the published signatures. cbindgen otherwise
# emits `uintptr_t`: the same width on every declared target, and a different
# type in the contract, which is not a change to make silently.

language = "C"
include_guard = "TETHERMESH_H"
documentation = true
documentation_style = "c"
cpp_compat = true
usize_is_size_t = true
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]

header = """
/*
 * SPDX-FileCopyrightText: 2026 Matthew Klapman
 * SPDX-License-Identifier: Apache-2.0
 *
 * tethermesh.h -- C interface to the tethermesh protocol library.
 *
 * GENERATED BY CBINDGEN. DO NOT EDIT.
 * Regenerate with gates/generate_header.sh; gates/check_docs.sh fails if this
 * file and the crate have drifted apart. It was maintained by hand until
 * 2026-08-18, and the reason it no longer is: a hand-written header drifts
 * SILENTLY, and the symptom is a field read at the wrong offset that presents
 * as a protocol bug rather than a build problem.
 *
 * tm_check_layout() still exists and is still worth calling at startup. It is
 * now a second line of defence rather than the first -- it catches a stale
 * header linked against a rebuilt library, which generation cannot.
 *
 * WHAT THIS LIBRARY IS AND IS NOT
 * -------------------------------
 * It is the Meshtastic protocol: framing, channel crypto, PKI direct messages,
 * and the routing decision. It is not a radio driver, has no clock, allocates
 * nothing, and holds no global state. Everything time-dependent takes `now_us`
 * as an argument, because a no_std library cannot portably know the time and a
 * hidden clock would be untestable.
 *
 * PREBUILT BINARIES
 * -----------------
 * If you encounter ABI boundary issues with a prebuilt library, REBUILD FROM
 * SOURCE. That is not a disclaimer of quality; float ABI variants, toolchain
 * versions and calling-convention flags differ between build environments in
 * ways a published artifact cannot anticipate, and rebuilding resolves them
 * definitively.
 *
 * MEMORY AND STACK
 * ----------------
 * The context is yours to place. tm_ctx_size() reports how much; putting it in
 * .bss means the linker checks the budget, where a task-stack local means a
 * stack overflow discovered in the field. On a Cortex-M with no MPU region that
 * overflow corrupts an adjacent task's memory and surfaces later as something
 * unrelated.
 *
 * Budget ~1 KB of stack for this library's own call depth, measured at 696
 * bytes worst case in CCM decrypt. FreeRTOS's configMINIMAL_STACK_SIZE of 512
 * bytes is smaller than one decrypt.
 *
 * One task per context needs no lock. Sharing one needs yours; nothing here can
 * enforce it, because Send/Sync do not cross this boundary.
 *
 * THE HAZARD THIS ABI IS DESIGNED AROUND
 * --------------------------------------
 * Meshtastic's PSK field is polymorphic: 0 bytes means no crypto, 16 or 32
 * bytes is a key, and 1 byte is a shorthand INDEX where 1 names the default key
 * and 2..10 name it with 1..9 added to its last byte. A function taking
 * (const uint8_t *, size_t) cannot tell them apart, and the failure is silent:
 * the first consumer written against this library passed the index {1} where
 * the expanded key was wanted and computed channel hash 0x0b instead of 0x08 --
 * wrong, unreported, and on the most common channel on the network. So there is
 * no such function. Build a key by naming which form you have, and pass
 * tm_key_t everywhere after.
 */

/* Opaque by design: size them with tm_ctx_size()/tm_outbox_size() and align
 * them with tm_ctx_align()/tm_outbox_align(), then place the storage yourself.
 * Their layout is not part of the ABI and will change without a version bump. */
struct tm_ctx_t;
struct tm_outbox_t;
typedef struct tm_ctx_t tm_ctx_t;
typedef struct tm_outbox_t tm_outbox_t;
"""

[parse]
parse_deps = false

[export]
exclude = ["TmCtx", "TmOutbox"]

[export.rename]
"TmKey"    = "tm_key_t"
"TmCtx"    = "tm_ctx_t"
"TmRx"     = "tm_rx_t"
"TmOutbox" = "tm_outbox_t"
"TmUser"   = "tm_user_t"
"TmPkiKey" = "tm_pki_key_t"
"TmData"   = "tm_data_t"
"TmHeader" = "tm_header_t"
