# targets.conf — the DECLARED TARGET SET, and the size budget for each.
#
# SPDX-FileCopyrightText: 2026 The tethermesh Authors
# SPDX-License-Identifier: Apache-2.0
#
# WHY THIS FILE EXISTS
# --------------------
# DISTRIBUTION.md promises "a declared target set ... listed explicitly rather
# than shipped as a scattering that leaves people guessing which gaps are
# deliberate", and "a size budget ... gated in CI [so] a regression fails the
# build, rather than being discovered on a device with 256 KB of flash".
#
# Both promises were prose until 2026-08-17. Nothing read them, so nothing
# enforced them: the set was whatever someone had last cross-compiled, and the
# budget was a sentence. This file is what the checks read.
#
# WHAT `text` MEASURES, AND WHAT IT DELIBERATELY DOES NOT
# -------------------------------------------------------
# `.text` of the CRATE OBJECT, emitted with `--emit=obj` and LTO off. That is
# the library's own code, and it is the number that regresses when someone adds
# bloat.
#
# It is NOT the archive size, and the difference is large enough to mislead: the
# thumbv8m archive is ~5.2 MB against 15.7 KB of crate object, because an
# archive carries every member and `--gc-sections` discards nearly all of it at
# link time. Gating the archive would measure mostly dead weight and move for
# reasons unrelated to this library.
#
# It is also NOT what a consumer pays. That is smaller again and depends on what
# they call -- tools/check_artifact_link.sh measured 164 bytes of linked .text
# for a consumer calling only channel_hash, which sheds the entire 5.4 KB X25519
# block. Three different numbers, three different questions; this file gates the
# middle one because it is the one that tracks OUR changes.
#
# ON THE CEILINGS
# ---------------
# Set with headroom above the measurement so ordinary work does not trip them,
# and tight enough that real bloat does. `measured` records what the figure
# actually was when the ceiling was set -- a ceiling with no recorded baseline
# cannot tell "we grew" from "it was always like that".
#
# RAISING A CEILING IS A DECISION, NOT A REPAIR. If a change pushes past one,
# the question is whether the growth is worth it, and the answer belongs in the
# commit message. Bumping the number to make the build pass is the failure this
# file exists to prevent.
#
# Format:  <rust-target> <crate> <text_ceiling> <measured_2026_08_17> <note>

thumbv8m.main-none-eabi     tethermesh  18000  15774  RP2350 Cortex-M33, soft float. What the reference firmware links.
thumbv8m.main-none-eabi     tmffi        3500   2556  C ABI shim for the same.

thumbv8m.main-none-eabihf   tethermesh  18000  15774  Cortex-M33, hard float. Identical text; the ABI differs, not the code.
thumbv8m.main-none-eabihf   tmffi        3500   2556  C ABI shim for the same.

thumbv7em-none-eabihf       tethermesh  18000  15482  Cortex-M4/M7.
thumbv7em-none-eabihf       tmffi        3500   2558  C ABI shim for the same.

# RISC-V is 56% larger than ARM and that is expected rather than a defect:
# riscv32imc has no hardware 64-bit divide, and airtime.rs does u64 arithmetic,
# so libgcc helpers (__udivdi3, __ashldi3) come in. Found by cross-compiling
# rather than by reading a list -- the same exercise that revealed the panic
# gate's allowlist was ARM-centric.
riscv32imc-unknown-none-elf tethermesh  28000  24640  ESP32-C3/C6.
riscv32imc-unknown-none-elf tmffi        3500   2720  C ABI shim for the same.

# x86_64-unknown-linux-gnu is deliberately ABSENT from the budget. It is where
# the tests and the differential oracles run, and it is not a deployment target;
# gating its size would measure a host toolchain's choices rather than ours.
