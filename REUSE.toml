# SPDX-FileCopyrightText: 2026 Matthew Klapman
# SPDX-License-Identifier: Apache-2.0
#
# REUSE bulk annotation, for files that cannot carry an inline SPDX header.
#
# Every source file in this repository declares its licence in its own text.
# These cannot: JSON has no comment syntax, Cargo.lock is generated, and
# .gitkeep files are empty by definition. Rather than scatter `.license`
# sidecar files, they are annotated in bulk here -- which is what the REUSE
# specification provides this file for.
#
# gates/check_spdx.sh accepts either mechanism and rejects anything covered by
# neither, so a new file cannot arrive undeclared.

version = 1
SPDX-PackageName = "tethermesh"
SPDX-PackageSupplier = "Matthew Klapman"
SPDX-PackageDownloadLocation = "https://github.com/tetherpoint/tethermesh"

# Captured fixtures. Our own nodes and our own traffic -- docs/TESTING.md requires
# these be synthetic-equivalent, never raw third-party traffic.
[[annotations]]
path = "tests/captures/**.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matthew Klapman"
SPDX-License-Identifier = "Apache-2.0"

# Generated by cargo; not hand-edited.
[[annotations]]
path = "Cargo.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matthew Klapman"
SPDX-License-Identifier = "Apache-2.0"

# Empty directory markers.
[[annotations]]
path = "**/.gitkeep"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Matthew Klapman"
SPDX-License-Identifier = "Apache-2.0"
