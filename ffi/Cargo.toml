[package]
name = "tmffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
# staticlib: the firmware links an archive. tethermesh stays an rlib so that it
# carries no panic handler of its own -- only one may exist per program, and
# forcing it on every consumer of the protocol library would be wrong.
crate-type = ["staticlib"]

[dependencies]
tethermesh = { path = ".." }

# NO [profile.release] HERE. Cargo ignores profiles on a non-root workspace
# package -- it warns, and the stanza silently does nothing. This crate carried
# one while it lived outside the workspace; leaving it after the move would be a
# block of settings that reads as authoritative and is inert.
#
# The workspace root's profile governs: panic = "abort", codegen-units = 1,
# opt-level = "z", and lto = true. The one difference from what this crate used
# to set for itself is LTO, which was false here and is true at the root. That
# is checked rather than assumed -- the artifact still links panic-free into a
# Cortex-M33 image, which is the property that matters and the only one this
# crate exists to preserve.

[lints]
workspace = true
